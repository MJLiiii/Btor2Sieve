[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btor2sieve"
version = "0.1.0"
description = "Word-level BTOR2 constraint extraction with replayable SMT validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.13,<6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
crosscheck = ["cvc5>=1.2"]

[project.scripts]
btor2sieve = "btor2sieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
